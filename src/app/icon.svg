<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alex Li">
  <!--
    An aperture, open on a night sky.

    The same mark the shutter button already uses, which is the one piece of
    iconography the site has of its own. It has to survive being drawn at
    sixteen pixels, so it is a ring and a dot and nothing else: the lens, the
    constellations and the hands are all far too fine to read at that size, and
    a favicon that turns to mush is worse than a plain letter.

    Warm white centre against amber, on the same sky the page is painted on.
  -->
  <rect width="64" height="64" rx="14" fill="#04070f" />

  <!-- A few stars, large enough to still be pixels when this is a tab. -->
  <circle cx="14" cy="15" r="1.6" fill="#fdfaf2" opacity="0.85" />
  <circle cx="52" cy="20" r="1.3" fill="#b8d4ff" opacity="0.7" />
  <circle cx="49" cy="48" r="1.5" fill="#fdfaf2" opacity="0.6" />
  <circle cx="16" cy="46" r="1.2" fill="#f6d99b" opacity="0.55" />

  <!-- The aperture. -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#e8b765" stroke-width="4.5" />
  <circle cx="32" cy="32" r="6" fill="#fdfaf2" />
</svg>
